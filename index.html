<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤقت الكتابة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: transparent;
      --card-bg: #ffffff;
      --border-subtle: #eae8e5;
      --text-main: #2f2b27;
      --text-muted: #8c827a;
      --accent: #b48356;
      --accent-soft: #f4ede4;
      --accent-hover: #9e6f43;
      --btn-sub-bg: #f8f7f5;
      --btn-sub-border: #e6e3df;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .widget-container {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .novel-title {
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--border-subtle);
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      width: 100%;
      padding: 4px;
      outline: none;
    }

    .novel-title:focus {
      border-color: var(--accent);
    }

    .chapter-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .chapter-row input {
      background: #faf9f7;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: 6px;
      padding: 3px 6px;
      width: 60px;
      text-align: center;
      font-size: 0.85rem;
      outline: none;
    }

    .chapter-row input:focus {
      border-color: var(--accent);
    }

    .timer-section {
      text-align: center;
    }

    .mode-pills {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .mode-btn {
      background: var(--btn-sub-bg);
      border: 1px solid var(--btn-sub-border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--accent-soft);
      color: var(--accent-hover);
      border-color: var(--accent);
      font-weight: 700;
    }

    .timer-display {
      font-size: 3rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1px;
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      padding: 6px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn-main {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-main:hover {
      background: var(--accent-hover);
    }

    .btn-sub {
      background: var(--btn-sub-bg);
      border: 1px solid var(--btn-sub-border);
      color: var(--text-main);
    }

    .btn-sub:hover {
      background: #eeebe7;
    }

    .sessions-counter {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="header">
      <input type="text" id="novelName" class="novel-title" placeholder="اسم الرواية..." />
      <div class="chapter-row">
        <span>الفصل:</span>
        <input type="number" id="currentChapter" min="1" value="1" onchange="saveData()" />
      </div>
    </div>

    <div class="timer-section">
      <div class="mode-pills">
        <button class="mode-btn active" onclick="setMode(this, 25)">كتابة (25د)</button>
        <button class="mode-btn" onclick="setMode(this, 5)">راحة (5د)</button>
        <button class="mode-btn" onclick="setMode(this, 15)">استراحة (15د)</button>
      </div>

      <div class="timer-display" id="timeDisplay">25:00</div>

      <div class="timer-controls">
        <button class="btn btn-main" id="startBtn" onclick="toggleTimer()">بدء</button>
        <button class="btn btn-sub" onclick="resetTimer()">إعادة ضبط</button>
      </div>

      <div class="sessions-counter">الجلسات المنجزة اليوم: <span id="sessionCount">0</span></div>
    </div>
  </div>

  <script>
    let timer;
    let isRunning = false;
    let timeLeft = 25 * 60;
    let currentModeMinutes = 25;
    let completedSessions = 0;

    const timeDisplay = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');
    const sessionCount = document.getElementById('sessionCount');

    function playAlarmSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log('Audio playback prevented');
      }
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timer);
        startBtn.textContent = 'استئناف';
        isRunning = false;
      } else {
        isRunning = true;
        startBtn.textContent = 'إيقاف';
        timer = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timer);
            isRunning = false;
            startBtn.textContent = 'بدء';
            handleComplete();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      startBtn.textContent = 'بدء';
      timeLeft = currentModeMinutes * 60;
      updateDisplay();
    }

    function setMode(element, minutes) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      currentModeMinutes = minutes;
      resetTimer();
    }

    function handleComplete() {
      playAlarmSound();
      if (currentModeMinutes === 25) {
        completedSessions++;
        sessionCount.textContent = completedSessions;
        localStorage.setItem('novel_sessions', completedSessions);
      }
    }

    function saveData() {
      localStorage.setItem('novel_name', document.getElementById('novelName').value);
      localStorage.setItem('novel_chapter', document.getElementById('currentChapter').value);
    }

    function loadData() {
      if (localStorage.getItem('novel_name')) {
        document.getElementById('novelName').value = localStorage.getItem('novel_name');
      }
      if (localStorage.getItem('novel_chapter')) {
        document.getElementById('currentChapter').value = localStorage.getItem('novel_chapter');
      }
      if (localStorage.getItem('novel_sessions')) {
        completedSessions = parseInt(localStorage.getItem('novel_sessions'), 10) || 0;
        sessionCount.textContent = completedSessions;
      }
      updateDisplay();
    }

    document.getElementById('novelName').addEventListener('input', saveData);
    window.onload = loadData;
  </script>
</body>
</html>
